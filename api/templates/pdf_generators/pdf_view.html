<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: "Arial", sans-serif;
            margin: 40px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header img {
            width: 80px;
        }
        h1 {
            font-size: 24px;
        }
        .questions {
            column-count: 2;
            column-gap: 40px;
        }
        .question {
            break-inside: avoid;
            margin-bottom: 20px;
        }
        .question p {
            font-weight: bold;
            margin: 0 0 5px;
        }
        .answers {
            list-style: none;
            padding-left: 0;
        }
        .answers li::before {
            content: counter(answer, upper-alpha);
            counter-increment: answer;
            display: inline-block;
            width: 1em;
            margin-right: 0.5em;
            font-weight: bold;
        }
        ul.answers {
            counter-reset: answer;
        }
        footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <img src="{{ logo_url }}" alt="Logo">
    <h1>{{ test_name }}</h1>
    <h2>{{ subject_name }}</h2>
</header>

<div class="questions">
    {% for subject in subjects %}
        {% for q in subject.questions %}
        <div class="question">
            <p>{{ forloop.parentloop.counter }}. {{ q.question }}</p>
            <ul class="answers">
                {% for ans in q.answers %}
                <li>{{ ans.answer }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    {% endfor %}
</div>

<footer>
    Page rendered by WeasyPrint
</footer>

</body>
</html>
